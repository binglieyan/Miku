<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>雪中Miku</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /*
     * CSS 背景层常驻显示。
     * canvas 为透明背景，粒子渲染在上层，浏览器合成器做图层叠加。
     * display mode 通过 JS 直接修改 background-size 属性切换。
     */
    #background {
      position: fixed;
      inset: 0;
      background: url(images/bg.png) center/cover no-repeat;
      z-index: 0;
    }

    canvas {
      position: fixed;
      width: 100%;
      height: 100%;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /*
     * 日期时间活动区域：四周留出边距，底部避开 Windows 任务栏。
     * 组件在这个区域内按 X/Y 百分比定位，永远不会被画到区域外。
     */
    #datetime-layer {
      position: fixed;
      inset: 2.2vmin 2.2vmin 56px;
      z-index: 2;
      pointer-events: none;
    }

    /*
     * 日期时间：left/top 与 translate 使用同一百分比，
     * 0% 时左边缘贴左、100% 时右边缘贴右，因此到 0/100 也不会被裁掉。
     */
    #datetime {
      position: absolute;
      left: 100%;
      top: 97.5%;
      transform: translate(-100%, -97.5%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      color: rgba(255, 255, 255, 0.92);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-align: right;
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(0, 0, 0, 0.32);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    #datetime[hidden] {
      display: none;
    }

    #datetime-date {
      font-size: clamp(12px, 1.1vmin, 22px);
      font-weight: 400;
      letter-spacing: 0.08em;
      opacity: 0.82;
    }

    #datetime-time {
      font-size: clamp(24px, 2.8vmin, 52px);
      font-weight: 300;
      letter-spacing: 0.03em;
    }
  </style>
</head>

<body>
  <div id="background"></div>
  <canvas id="canvas"></canvas>

  <div id="datetime-layer">
    <div id="datetime" role="timer" aria-live="off">
      <div id="datetime-time"></div>
      <div id="datetime-date"></div>
    </div>
  </div>

  <!--
    背景音乐。路径是硬编码的：把音频文件命名为 bgm.flac 放进 music/ 即可，
    换其它格式就改下面的 src。本壁纸发行包内不含任何音频文件，用户自备，
    操作步骤见 music/README.md。

    preload="none" 是刻意的：发行包里没有这个文件，preload="auto" 会在解析
    HTML 时就发起请求，控制台必然留下一条 404（那行是浏览器网络层打印的，
    JS 拦不掉、改不了）。preload="none" 让请求推迟到用户真正开音乐时才发。
    loop 由浏览器原生循环；自动播放被拦截时的容错见 js/audio.js。
  -->
  <audio id="bgm" src="music/bgm.flac" loop preload="none"></audio>

  <script type="module" src="js/settings.js"></script>
</body>

</html>
